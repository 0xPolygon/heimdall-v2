# codegenie AI code review config. See https://github.com/0xPolygon/codegenie
#
# Provider credentials and model selection live in the workflow
# (.github/workflows/codegenie-review.yml) for CI and in ~/.codegenie/ locally;
# only repo-safe review/classification keys belong here.
#
# baseBranch applies to local `codegenie review` on a branch. CI runs in PR
# mode, where the base comes from the PR itself and this key is unused.

[git]
baseBranch = "develop"

[review]
depth = "normal"

# Generated code — regenerated by tooling, not hand-reviewed.

[[classification.pathRules]]
pattern = "**/*.pb.go"
processingMode = "skip"
reason = "protoc-generated protobuf bindings"

[[classification.pathRules]]
pattern = "**/*.pb.gw.go"
processingMode = "skip"
reason = "grpc-gateway-generated REST shims"

[[classification.pathRules]]
pattern = "**/*.pulsar.go"
processingMode = "skip"
reason = "protoc-gen-go-pulsar generated fast-path codec"

[[classification.pathRules]]
pattern = "api/**"
processingMode = "skip"
reason = "generated Cosmos API module (buf generate)"

[[classification.pathRules]]
pattern = "helper/mocks/**"
processingMode = "skip"
reason = "mockery-generated contract-caller and HTTP-client doubles"

# Consensus-critical zones, mirroring the path scopes in .claude/rules. Bugs
# here can halt the chain, split consensus, or lose funds.

[[classification.pathRules]]
pattern = "app/**"
reviewPriority = "critical"
labels = ["consensus"]
reason = "ABCI++ lifecycle — PrepareProposal / ProcessProposal / PreBlocker parity, vote extensions, ante chain"

[[classification.pathRules]]
pattern = "sidetxs/**"
reviewPriority = "critical"
labels = ["consensus"]
reason = "side-transaction vote collection and side/post handler dispatch"

[[classification.pathRules]]
pattern = "helper/config.go"
reviewPriority = "critical"
labels = ["hardfork"]
reason = "network hardfork height globals and their getters; off-by-one activation risk"

[[classification.pathRules]]
pattern = "x/*/keeper/**"
reviewPriority = "critical"
labels = ["consensus"]
reason = "module state transitions — the deterministic write path for every module"

[[classification.pathRules]]
pattern = "x/milestone/abci/**"
reviewPriority = "critical"
labels = ["consensus"]
reason = "milestone proposal and voting logic; drives VEBLOP producer selection"

[[classification.pathRules]]
pattern = "x/*/module.go"
reviewPriority = "critical"
labels = ["migration"]
reason = "Cosmos module consensus versions and registered store migrations"

[[classification.pathRules]]
pattern = "x/bor/**"
reviewPriority = "critical"
labels = ["consensus", "span"]
reason = "span and producer-set selection consumed by Bor"

[[classification.pathRules]]
pattern = "x/checkpoint/**"
reviewPriority = "critical"
labels = ["consensus", "checkpoint"]
reason = "checkpoint construction and acceptance; L1 settlement path"

[[classification.pathRules]]
pattern = "x/stake/**"
reviewPriority = "critical"
labels = ["consensus", "staking"]
reason = "validator set, voting power, signer changes, jailing"

[[classification.pathRules]]
pattern = "x/clerk/**"
reviewPriority = "critical"
labels = ["cross-chain"]
reason = "state-sync record ordering; Bor rejects gapped or out-of-order IDs"

[[classification.pathRules]]
pattern = "x/topup/**"
reviewPriority = "critical"
labels = ["cross-chain", "funds"]
reason = "L1 deposit crediting; fund-loss surface"

[[classification.pathRules]]
pattern = "x/chainmanager/**"
reviewPriority = "critical"
labels = ["hardfork"]
reason = "chain params and height-gated chain-manager migrations"

[[classification.pathRules]]
pattern = "proto/**"
reviewPriority = "critical"
labels = ["wire"]
reason = "wire schema — new vote-extension fields are not inert pre-fork under strict unknown-field rejection"

[[classification.pathRules]]
pattern = "types/**"
reviewPriority = "critical"
labels = ["wire"]
reason = "shared encoding and address types used across every module"
