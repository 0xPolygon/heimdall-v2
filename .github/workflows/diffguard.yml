name: diffguard

on:
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened]

jobs:
  diffguard:
    name: Quality metrics
    runs-on: ubuntu-latest
    # mutation testing runs the RabbitMQ-backed bridge queue tests for every mutant
    timeout-minutes: 40
    concurrency:
      group: diffguard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    services:
      # bridge/queue's broker tests run against a real RabbitMQ
      rabbitmq:
        image: mirror.gcr.io/library/rabbitmq:4.4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BRIDGE_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v7
        with:
          # diffguard needs full history for merge-base and file history checks.
          fetch-depth: 0

      - name: Fetch base branch ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-diffguard-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-diffguard-

      - name: Install diffguard
        run: go install github.com/0xPolygon/diffguard/cmd/diffguard@835413b44e3820700cea0d5e391d1948b458f2e6

      - name: Run diffguard
        id: diffguard
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Keep diffguard's exit code when tee writes the step summary.
          set -o pipefail
          diffguard \
            --base "origin/$BASE_REF" \
            --complexity-threshold 15 \
            --complexity-delta-tolerance 5 \
            --function-size-threshold 80 \
            --function-size-delta-tolerance 15 \
            --file-size-threshold 800 \
            --file-size-delta-tolerance-pct 10 \
            --file-size-delta-tolerance-floor 20 \
            --tier1-threshold 80 \
            --tier2-threshold 60 \
            --mutation-sample-rate 100 \
            --test-timeout 5m \
            --output text \
            --fail-on all \
            . | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report
        # The text report above contains mutation results; this second run is
        # only for a cheap machine-readable shape report.
        if: always()
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          diffguard \
            --base "origin/$BASE_REF" \
            --complexity-threshold 15 \
            --complexity-delta-tolerance 5 \
            --function-size-threshold 80 \
            --function-size-delta-tolerance 15 \
            --file-size-threshold 800 \
            --file-size-delta-tolerance-pct 10 \
            --file-size-delta-tolerance-floor 20 \
            --tier1-threshold 80 \
            --tier2-threshold 60 \
            --skip-mutation \
            --output json \
            --fail-on none \
            . > diffguard-report.json

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: diffguard-report
          path: diffguard-report.json
          retention-days: 14
          if-no-files-found: ignore
